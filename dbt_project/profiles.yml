flight_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/lakehouse.duckdb') }}"
      threads: "{{ env_var('DUCKDB_THREADS', '4') | int }}"
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '4GB') }}"
        TimeZone: UTC
