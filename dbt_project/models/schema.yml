version: 2

models:
  - name: stg_bts_flights
    description: "Staging view for historical BTS flight-performance data stored in partitioned Parquet files."
    columns:
      - name: flight_date
        description: "Scheduled flight date."
        tests:
          - not_null
      - name: carrier
        description: "Reporting carrier code (e.g., AA, DL, UA)."
        tests:
          - not_null
      - name: origin
        description: "Origin airport code."
        tests:
          - not_null
      - name: dest 
        descrption: "Destination airport code."
        tests:
          - not_null
      - name: is_delayed
        description: "True when arrival delay exceeds 15 minutes; null when arrival delay is unavailable."

  - name: stg_opensky_states
    description: "Staging model for validated OpenSky aircraft state-vector data loaded into DuckDB. Grain: one aircraft per snapshot."
    tests:
      - unique:
          column_name: "icao24 || '-' || CAST(snapshot_timestamp AS VARCHAR)"
    columns:
      - name: icao24
        description: "24-bit ICAO transponder address identifyig an aircraft."
        tests:
          - not_null
      - name: snapshot_timestamp
        description: "Timestamp associated with the OpenSky state-vector snapshot."
        tests:
          - not_null

  - name: mart_carrier_performance
    description: "Carrier-level historical flight-performance metrics derived from BTS data. Grain: one row per carrier."
    columns:
      - name: carrier
        description: "Unique reporting airline carrier identifier."
        tests:
          - not_null
          - unique
      - name: total_flights
        description: "Total number of historical flight records for the carrier."
        tests:
          - not_null
      - name: avg_dep_delay
        description: "Average departure delay in minutes."
      - name: avg_arr_delay
        description: "Average arrival delay in minutes."
      - name: delayed_flight_pct
        description: "Percentage of flights with known arrival-delay status that arrived more than 15 minutes late."